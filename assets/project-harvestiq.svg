<text x="48" y="136" class="s" font-size="18" fill="#C9D1D9">Sell-or-wait recommendations for farmers, from mandi price forecasts.</text>
<text x="48" y="174" class="m" font-size="11" fill="#5B6678" letter-spacing="2">PROBLEM</text>
<text x="140" y="174" class="s" font-size="14" fill="#8792A5">Farmers sell at post-harvest price lows with no forecast to guide timing.</text>
<text x="48" y="200" class="m" font-size="11" fill="#5B6678" letter-spacing="2">STACK</text>
<text x="140" y="200" class="s" font-size="14" fill="#8792A5">JavaScript · Node.js · Express · Firebase · Twilio SMS</text>

<line x1="820" y1="30" x2="820" y2="200" stroke="#1A2230"/>
<line x1="840" y1="190" x2="1150" y2="190" stroke="#1A2230"/>
<line x1="990" y1="40" x2="990" y2="190" stroke="#2A3648" stroke-dasharray="3 4"/>
