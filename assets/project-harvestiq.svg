<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="HarvestIQ: price history and forecast leading to a sell or wait recommendation">
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<rect x="0.5" y="0.5" width="1199" height="229" rx="16" fill="#07090E" stroke="#1A2230"/>
<text x="48" y="48" class="m" font-size="12" fill="#22D3EE" letter-spacing="3">03 · AGRITECH · PROTOTHON 2026</text>
